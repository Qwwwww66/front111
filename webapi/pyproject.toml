[project]
name = "ecomats-webapi"
version = "0.1.0"
description = "Web API bridging the ECOMATS CrewAI workflows with the new frontend."
authors = [
  {name = "ECOMATS Team"}
]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-dotenv>=1.0.1",
  "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
